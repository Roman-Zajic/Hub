{% extends 'layout.html' %}
{% block module_name %}Notes{% endblock %}

{% block extra_css %}
<style>
    .notes-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; height: 100%; min-height: 0; }
    .file-panel { background: white; border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
    .file-list { flex: 1; overflow-y: auto; padding: 12px; }
    .folder-header { padding: 6px 0; font-size: 0.8125rem; font-weight: 600; color: var(--teal-900); cursor: pointer; border-radius: 4px; background: var(--surface-in); display: flex; align-items: center; }
    .folder-header::before { content: '>'; font-family: monospace; width: 24px; display: flex; justify-content: center; transition: transform 0.1s; flex-shrink: 0; }
    .folder-header.expanded::before { transform: rotate(90deg); }
    #rootHeader::before { display: none; } #rootHeader { padding-left: 10px; }
    .folder-content { margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--border); display: none; }
    .folder-content.expanded { display: block; }
    .file-item { padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8125rem; color: var(--teal-700); }
    .file-item.active { background: var(--teal-100); color: var(--teal-900); font-weight: 600; }

    .editor-panel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .editor-textarea { display: none; flex: 1; border: 1px solid var(--border); padding: 16px; border-radius: 10px; font-size: 0.9375rem; outline: none; background: white; overflow-y: auto; font-family: monospace; resize: none; line-height: 1.6; }

    .preview-area {
    display: block;
    flex: 1;
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 10px;
    font-size: 0.9375rem;
    background: white;
    overflow-y: auto;
    line-height: 1.6;
    color: var(--teal-900);
    }

    /* Markdown defaults */
    .preview-area p {
        margin: 0 0 1em;
    }

    .preview-area h1 {
        font-size: 1.8rem;
        margin: 1em 0 0.5em;
        border-bottom: 1px solid var(--border);
        padding-bottom: 4px;
    }

    .preview-area h2 {
        font-size: 1.4rem;
        margin: 1em 0 0.5em;
    }

    .preview-area h3 {
        font-size: 1.2rem;
        margin: 1em 0 0.5em;
    }

    .preview-area ul,
    .preview-area ol {
        margin: 1em 0;
        padding-left: 2em;
    }

    .preview-area li {
        margin: 0.25em 0;
    }

    .preview-area table {
        width: 100%;
        border-collapse: collapse;
        margin: 1em 0;
    }

    .preview-area th,
    .preview-area td {
        border: 1px solid var(--border);
        padding: 8px;
    }

    .preview-area pre {
        margin: 1em 0;
        padding: 16px;
        background: #f5f7f7;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow-x: auto;
        white-space: pre-wrap;
    }

    .preview-area code {
        font-family: monospace;
    }

    .preview-area pre code {
        background: none;
        padding: 0;
    }

    .preview-area blockquote {
        margin: 1em 0;
        padding-left: 16px;
        border-left: 4px solid var(--amber);
        font-style: italic;
    }

    .preview-area pre {
    position: relative;
    margin: 1em 0;
    padding: 16px;
    background: #f5f7f7;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
    }

    .copy-code-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        border: 1px solid var(--border);
        background: white;
        color: var(--teal-700);
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .copy-code-btn:hover {
        background: var(--surface-page);
    }

    .editor-footer { display: flex; gap: 8px; align-items: center; padding-top: 4px; }
    .input { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; outline: none; font-size: 0.875rem; }
    .btn { padding: 0 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 0.8125rem; height: 36px; display: inline-flex; align-items: center; }
    .btn-outline { background: white; border: 1px solid var(--border); color: var(--teal-700); }
    .btn-del { background: #FDEAED; color: #C41E3A; }
    .save-status { font-size: 0.7rem; color: var(--teal-400); font-weight: 600; text-transform: uppercase; margin-left: auto; }
</style>
{% endblock %}

{% block content %}
<div class="notes-layout">
    <div class="file-panel">
        <div class="file-list" id="treeRoot">
            <div class="folder-header expanded" id="rootHeader" onclick="selectFolder('', this)">Notes</div>
            <div class="folder-content expanded" id="rootFiles"></div>
        </div>
        <button onclick="newNote()" style="margin:10px; padding:8px; border:1px dashed var(--teal-700); background:none; color:var(--teal-700); cursor:pointer; border-radius:4px; font-size:0.75rem;">+ NEW NOTE</button>
    </div>
    <div class="editor-panel">
        <textarea id="noteContent" class="editor-textarea" placeholder="# Start writing..." oninput="autoSave()"></textarea>
        <div id="previewArea" class="preview-area"></div>
        <div class="editor-footer">
            <span style="font-size:0.75rem; color:var(--teal-700)" id="pathDisp">Notes /</span>
            <input type="text" id="noteTitle" class="input" style="flex:1" placeholder="filename" oninput="autoSave()">
            <span id="saveStatus" class="save-status"></span>
            <button class="btn btn-outline" id="toggleModeBtn" onclick="toggleMode()">Edit Mode</button>
            <button class="btn btn-del" id="delBtn" onclick="deleteNote()" style="display:none">Delete</button>
        </div>
    </div>
</div>

<script>
    let activeFolder = ""; let saveTimeout = null; let isPreviewMode = true; let isCreating = false;
    const files = {{ files|tojson }};

    function addCopyButtons() {
        document.querySelectorAll('#previewArea pre').forEach(pre => {

            if (pre.querySelector('.copy-code-btn')) return;

            const btn = document.createElement('button');
            btn.className = 'copy-code-btn';
            btn.textContent = 'Copy';

            btn.onclick = async () => {
                const code = pre.querySelector('code');

                try {
                    await navigator.clipboard.writeText(
                        code ? code.innerText : pre.innerText
                    );

                    btn.textContent = 'Copied!';

                    setTimeout(() => {
                        btn.textContent = 'Copy';
                    }, 1500);

                } catch {
                    btn.textContent = 'Failed';

                    setTimeout(() => {
                        btn.textContent = 'Copy';
                    }, 1500);
                }
            };

            pre.appendChild(btn);
        });
    }

    function buildTree() {
        const rootContainer = document.getElementById('rootFiles');
        const folders = {}; const rootFiles = [];
        files.forEach(path => {
            const parts = path.split('/');
            const display = parts[parts.length-1].replace('.md', '');
            if (parts.length > 1) {
                if (!folders[parts[0]]) folders[parts[0]] = [];
                folders[parts[0]].push({ path, name: display });
            } else { rootFiles.push({ path, name: display }); }
        });
        Object.keys(folders).sort().forEach(name => {
            const group = document.createElement('div');
            group.className = 'folder-group';
            group.innerHTML = `<div class="folder-header" onclick="toggleFolder(this, '${name}')">${name}</div><div class="folder-content" id="f-${name}"></div>`;
            rootContainer.appendChild(group);
            folders[name].forEach(f => createFileEl(document.getElementById(`f-${name}`), f.path, f.name));
        });
        rootFiles.forEach(f => createFileEl(rootContainer, f.path, f.name));
    }

    function createFileEl(parent, path, name) {
        const el = document.createElement('div'); el.className = 'file-item'; el.innerText = name;
        el.onclick = (e) => { e.stopPropagation(); loadNote(path, el); };
        parent.appendChild(el);
    }

    function toggleFolder(el, name) {
        const content = document.getElementById(`f-${name}`);
        el.classList.toggle('expanded'); content.classList.toggle('expanded');
        selectFolder(name, el);
    }

    function selectFolder(path, el) {
        activeFolder = path;
        document.querySelectorAll('.folder-header').forEach(h => h.classList.remove('active-folder'));
        el.classList.add('active-folder');
        document.getElementById('pathDisp').innerText = (path || 'Notes') + ' /';
    }

    function toggleMode() {
        const txt = document.getElementById('noteContent'); const pre = document.getElementById('previewArea'); const btn = document.getElementById('toggleModeBtn');
        if (isPreviewMode) {
            txt.style.display = 'block'; pre.style.display = 'none';
            btn.innerText = 'Preview Mode'; isPreviewMode = false;
        } else { renderPreview(); }
    }

    function renderPreview() {
        const txt = document.getElementById('noteContent');
        const pre = document.getElementById('previewArea');
        const btn = document.getElementById('toggleModeBtn');

        fetch('/notes/preview', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                content: txt.value
            })
        })
        .then(res => res.json())
        .then(data => {

            pre.innerHTML = data.html;

            addCopyButtons();

            txt.style.display = 'none';
            pre.style.display = 'block';

            btn.innerText = 'Edit Mode';
            isPreviewMode = true;
        });
    }

    function loadNote(fullPath, el) {
        isCreating = false;
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const parts = fullPath.split('/'); const name = parts.pop().replace('.md', ''); activeFolder = parts.join('/');
        fetch(`/notes/load/${fullPath}`).then(res => res.json()).then(data => {
            document.getElementById('noteTitle').value = name; document.getElementById('noteContent').value = data.content;
            document.getElementById('pathDisp').innerText = (activeFolder || 'Notes') + ' /';
            document.getElementById('delBtn').style.display = "flex"; document.getElementById('saveStatus').innerText = "";
            renderPreview();
        });
    }

    function autoSave() {
        const status = document.getElementById('saveStatus'); const name = document.getElementById('noteTitle').value; if (!name) return;
        status.innerText = "Saving..."; clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            let filename = name.endsWith('.md') ? name : name + '.md';
            const path = activeFolder ? `${activeFolder}/${filename}` : filename;
            fetch('/notes/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filename: path, content: document.getElementById('noteContent').value }) })
            .then(() => { status.innerText = "Saved"; if (isCreating) { isCreating = false; location.reload(); } });
        }, 800);
    }

    function newNote() {
        isCreating = true;
        document.getElementById('noteTitle').value = ""; document.getElementById('noteContent').value = "";
        document.getElementById('delBtn').style.display = "none";
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        isPreviewMode = false;
        document.getElementById('noteContent').style.display = 'block'; document.getElementById('previewArea').style.display = 'none';
        document.getElementById('toggleModeBtn').innerText = 'Preview Mode';
        document.getElementById('noteTitle').focus();
    }

    function deleteNote() {
        let name = document.getElementById('noteTitle').value; if (!name.endsWith('.md')) name += '.md';
        const path = activeFolder ? `${activeFolder}/${name}` : name;
        if (confirm("Delete?")) { fetch('/notes/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filename: path }) }).then(() => location.reload()); }
    }

    buildTree();
</script>
{% endblock %}
