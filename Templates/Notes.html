{% extends 'layout.html' %}
{% block module_name %}Notes{% endblock %}

{% block extra_css %}
<style>
    /* ── Notes Layout ──────────────────────────────────────── */
    .notes-layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 24px;
        height: 100%;
        min-height: 0;
    }

    /* ── File Tree ─────────────────────────────────────────── */
    .file-panel {
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .file-list   { flex: 1; overflow-y: auto; padding: 12px; }
    .new-note-btn {
        margin: 10px;
        padding: 8px;
        border: 1px dashed var(--teal-700);
        background: none;
        color: var(--text-muted);
        cursor: pointer;
        border-radius: 4px;
        font-size: 0.75rem;
        font-family: var(--font);
        transition: background 130ms, color 130ms;
    }
    .new-note-btn:hover { background: var(--surface-in); color: var(--text); }

    .folder-header {
        padding: 6px 0 6px 10px;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text);
        cursor: pointer;
        border-radius: 4px;
        display: flex;
        align-items: center;
        transition: background 130ms;
    }
    .folder-header:hover { background: var(--surface-in); }
    .folder-header::before {
        content: '›';
        font-size: 1rem;
        width: 20px;
        flex-shrink: 0;
        transition: transform 0.15s;
        display: inline-block;
    }
    .folder-header.expanded::before { transform: rotate(90deg); }
    #rootHeader::before { display: none; }

    .folder-content { margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--border); display: none; }
    .folder-content.expanded { display: block; }

    .file-item {
        padding: 5px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8125rem;
        color: var(--text-muted);
        transition: background 130ms, color 130ms;
    }
    .file-item:hover  { background: var(--surface-in); color: var(--text); }
    .file-item.active { background: var(--teal-100); color: var(--ink); font-weight: 600; }

    /* ── Editor Panel ──────────────────────────────────────── */
    .editor-panel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

    .editor-textarea {
        flex: 1;
        border: 1px solid var(--border);
        padding: 16px;
        border-radius: var(--r);
        font-size: 0.9375rem;
        font-family: monospace;
        color: var(--text);
        outline: none;
        background: var(--surface-card);
        overflow-y: auto;
        resize: none;
        line-height: 1.6;
        display: none;
        box-shadow: var(--shadow);
        transition: border-color 130ms, box-shadow 130ms;
    }
    .editor-textarea:hover { border-color: var(--teal-700); }
    .editor-textarea:focus { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(0,130,130,.15); }

    .preview-area {
        flex: 1;
        border: 1px solid var(--border);
        padding: 20px;
        border-radius: var(--r);
        font-size: 0.9375rem;
        background: var(--surface-card);
        box-shadow: var(--shadow);
        overflow-y: auto;
        line-height: 1.6;
        color: var(--text);
    }

    /* ── Markdown Preview Styles ───────────────────────────── */
    .preview-area p           { margin: 0 0 1em; }
    .preview-area h1,
    .preview-area h2,
    .preview-area h3          { color: var(--text); font-weight: 600; margin-bottom: 0.4em; }
    .preview-area h1          { font-size: 1.75rem; margin-bottom: 0.5em; }
    .preview-area h2          { font-size: 1.375rem; }
    .preview-area h3          { font-size: 1.125rem; }
    .preview-area * + h1,
    .preview-area * + h2,
    .preview-area * + h3      { margin-top: 1.5em; }
    .preview-area ul,
    .preview-area ol          { margin: 1em 0; padding-left: 2em; }
    .preview-area li          { margin: 0.25em 0; }
    .preview-area hr          { border: none; height: 2px; background: var(--border); margin: 32px auto; border-radius: 2px; }
    .preview-area blockquote  { margin: 1em 0; padding-left: 16px; border-left: 4px solid var(--amber); font-style: italic; color: var(--text-muted); }

    .preview-area table {
        width: fit-content; max-width: 100%; margin: 24px 0;
        font-size: 0.875rem; background: var(--surface-card);
        border-collapse: separate; border-spacing: 0;
        border: 1px solid var(--border); border-radius: var(--r); overflow: hidden;
        box-shadow: var(--shadow);
    }
    .preview-area th { background: var(--surface-in); color: var(--text); font-weight: 600; text-align: left; padding: 10px 16px; border-right: 1px solid var(--border); border-bottom: 2px solid var(--border); font-size: 0.8125rem; }
    .preview-area td { padding: 10px 16px; color: var(--text); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .preview-area th:last-child,
    .preview-area td:last-child  { border-right: none; }
    .preview-area tr:last-child td { border-bottom: none; }
    .preview-area tbody tr:hover td { background: var(--surface-in); }

    .preview-area pre {
        position: relative; margin: 1em 0; padding: 16px;
        background: var(--surface-in); border: 1px solid var(--border);
        border-radius: 8px; overflow-x: auto; white-space: pre-wrap;
    }
    .preview-area code         { font-family: monospace; font-size: 0.875em; }
    .preview-area pre code     { background: none; padding: 0; }

    .copy-code-btn {
        position: absolute; top: 8px; right: 8px;
        border: 1px solid var(--border); background: var(--surface-card);
        color: var(--text-muted); padding: 4px 10px;
        border-radius: 4px; cursor: pointer;
        font-size: 0.75rem; font-weight: 600; font-family: var(--font);
        transition: background 130ms, color 130ms, border-color 130ms;
    }
    .copy-code-btn:hover { background: var(--surface-in); color: var(--text); border-color: var(--teal-700); }

    /* ── Footer ────────────────────────────────────────────── */
    .editor-footer { display: flex; gap: 8px; align-items: center; padding-top: 4px; }
    .path-display  { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
    .save-status   { font-size: 0.6875rem; color: var(--teal-400); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-left: auto; }
</style>
{% endblock %}

{% block content %}
<div class="notes-layout">

    <!-- ── File Tree ── -->
    <div class="file-panel">
        <div class="file-list" id="treeRoot">
            <div class="folder-header expanded" id="rootHeader">Notes</div>
            <div class="folder-content expanded" id="rootFiles"></div>
        </div>
        <button class="new-note-btn" onclick="newNote()">+ NEW NOTE</button>
    </div>

    <!-- ── Editor / Preview ── -->
    <div class="editor-panel">
        <textarea id="noteContent" class="editor-textarea"
                  placeholder="# Start writing..."
                  oninput="scheduleSave()"></textarea>
        <div id="previewArea" class="preview-area"></div>

        <div class="editor-footer">
            <span class="path-display" id="pathDisp">Notes /</span>
            <input type="text" id="noteTitle" class="input" style="flex:1"
                   placeholder="filename" oninput="scheduleSave()">
            <span id="saveStatus" class="save-status"></span>
            <button class="btn btn-outline" id="toggleModeBtn" onclick="toggleMode()">Edit</button>
            <button class="btn btn-danger" id="delBtn" onclick="deleteNote()" style="display:none">Delete</button>
        </div>
    </div>
</div>

<script>
    // ── State ────────────────────────────────────────────────
    const files       = {{ files|tojson }};
    let activeFolder  = '';
    let saveTimer     = null;
    let isPreview     = true;   // true = showing rendered HTML
    let isNew         = false;  // true = unsaved new note (reload on first save)

    // ── DOM refs ─────────────────────────────────────────────
    const elContent   = document.getElementById('noteContent');
    const elPreview   = document.getElementById('previewArea');
    const elTitle     = document.getElementById('noteTitle');
    const elPath      = document.getElementById('pathDisp');
    const elStatus    = document.getElementById('saveStatus');
    const elToggleBtn = document.getElementById('toggleModeBtn');
    const elDelBtn    = document.getElementById('delBtn');

    // ── Tree ─────────────────────────────────────────────────
    function buildTree() {
        const root    = document.getElementById('rootFiles');
        const folders = {};
        const loose   = [];

        files.forEach(path => {
            const parts = path.split('/');
            const label = parts.at(-1).replace('.md', '');
            if (parts.length > 1) {
                (folders[parts[0]] ??= []).push({ path, label });
            } else {
                loose.push({ path, label });
            }
        });

        Object.keys(folders).sort().forEach(name => {
            const group = document.createElement('div');
            group.innerHTML =
                `<div class="folder-header" onclick="toggleFolder(this,'${name}')">${name}</div>
                 <div class="folder-content" id="f-${name}"></div>`;
            root.appendChild(group);
            folders[name].forEach(f => appendFileEl(document.getElementById(`f-${name}`), f.path, f.label));
        });

        loose.forEach(f => appendFileEl(root, f.path, f.label));
    }

    function appendFileEl(parent, path, label) {
        const el = document.createElement('div');
        el.className  = 'file-item';
        el.textContent = label;
        el.onclick = e => { e.stopPropagation(); loadNote(path, el); };
        parent.appendChild(el);
    }

    function toggleFolder(el, name) {
        el.classList.toggle('expanded');
        document.getElementById(`f-${name}`).classList.toggle('expanded');
    }

    // ── Mode: preview ↔ edit ─────────────────────────────────
    function setMode(mode) {
        isPreview = mode === 'preview';
        if (isPreview) {
            // Render then swap
            fetch('/notes/preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: elContent.value })
            })
            .then(r => r.json())
            .then(({ html }) => {
                elPreview.innerHTML = html;
                attachCopyButtons();
                elContent.style.display = 'none';
                elPreview.style.display  = 'block';
                elToggleBtn.textContent  = 'Edit';
            });
        } else {
            elPreview.style.display  = 'none';
            elContent.style.display  = 'block';
            elContent.focus();
            elToggleBtn.textContent  = 'Preview';
        }
    }

    function toggleMode() { setMode(isPreview ? 'edit' : 'preview'); }

    // ── Copy buttons in code blocks ──────────────────────────
    function attachCopyButtons() {
        elPreview.querySelectorAll('pre:not(:has(.copy-code-btn))').forEach(pre => {
            const btn = document.createElement('button');
            btn.className   = 'copy-code-btn';
            btn.textContent = 'Copy';
            btn.onclick = async () => {
                const text = (pre.querySelector('code') ?? pre).innerText;
                await navigator.clipboard.writeText(text).catch(() => {});
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 1500);
            };
            pre.appendChild(btn);
        });
    }

    // ── Load / Save / Delete ─────────────────────────────────
    function loadNote(fullPath, el) {
        isNew = false;
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');

        const parts  = fullPath.split('/');
        const name   = parts.pop().replace('.md', '');
        activeFolder = parts.join('/');

        fetch(`/notes/load/${fullPath}`)
            .then(r => r.json())
            .then(({ content }) => {
                elTitle.value    = name;
                elContent.value  = content;
                elPath.textContent = (activeFolder || 'Notes') + ' /';
                elStatus.textContent = '';
                elDelBtn.style.display = 'flex';
                setMode('preview');
            });
    }

    function scheduleSave() {
        const name = elTitle.value.trim();
        if (!name) return;
        elStatus.textContent = 'Saving…';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveNote, 800);
    }

    function saveNote() {
        const name = elTitle.value.trim();
        if (!name) return;

        const filename = name.endsWith('.md') ? name : name + '.md';
        const path     = activeFolder ? `${activeFolder}/${filename}` : filename;

        fetch('/notes/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: path, content: elContent.value })
        }).then(() => {
            elStatus.textContent = 'Saved';
            if (isNew) { isNew = false; location.reload(); }
        });
    }

    function newNote() {
        isNew = true;
        elTitle.value    = '';
        elContent.value  = '';
        elDelBtn.style.display = 'none';
        elStatus.textContent   = '';
        document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
        setMode('edit');
        elTitle.focus();
    }

    function deleteNote() {
        let name = elTitle.value.trim();
        if (!name) return;
        if (!name.endsWith('.md')) name += '.md';
        const path = activeFolder ? `${activeFolder}/${name}` : name;

        if (!confirm(`Delete "${name}"?`)) return;

        fetch('/notes/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: path })
        }).then(() => location.reload());
    }

    buildTree();
</script>
{% endblock %}
