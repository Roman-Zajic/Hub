{% extends 'layout.html' %}
{% block module_name %}Code Compare{% endblock %}

{% block extra_css %}
<style>
    /* ── Layout ─────────────────────────────────────────────── */
    .compare-container { display: flex; flex-direction: column; height: 100%; gap: 16px; }

    .compare-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--surface-card);
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        flex-shrink: 0;
    }
    .nav-controls { display: flex; gap: 4px; align-items: center; margin-left: auto; }
    .change-count { font-size: 0.8125rem; color: var(--text-muted); font-weight: 600; margin-right: 8px; }
    .save-status { font-size: 0.6875rem; color: var(--teal-400); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }

    /* ── Input area ─────────────────────────────────────────── */
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
    .input-box  { display: flex; flex-direction: column; gap: 8px; }
    .input-box label { font-size: 0.6875rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .compare-textarea {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        font-family: 'Consolas', monospace;
        font-size: 0.8125rem;
        color: var(--text);
        background: var(--surface-card);
        resize: none;
        outline: none;
        transition: border-color 130ms, box-shadow 130ms;
    }
    .compare-textarea:hover { border-color: var(--teal-700); }
    .compare-textarea:focus { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(0,130,130,.15); }

    /* ── Diff view ──────────────────────────────────────────── */
    .diff-view {
        display: none;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        flex: 1;
        min-height: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: var(--shadow);
    }
    .diff-panel { overflow: auto; height: 100%; background: var(--surface-card); scrollbar-width: thin; }

    /* Table layout — both panels share identical column widths for scroll sync */
    .diff-content {
        display: table;
        min-width: 100%;
        font-family: 'Consolas', monospace;
        font-size: 0.8125rem;
        line-height: 1.6;
        border-collapse: collapse;
        table-layout: fixed;
    }
    .diff-line { display: table-row; }
    .line-num  {
        display: table-cell;
        width: 44px;
        padding: 0 8px;
        text-align: right;
        color: var(--teal-400);
        background: var(--surface-in);
        border-right: 1px solid var(--border);
        user-select: none;
        font-size: 0.7rem;
        vertical-align: top;
    }
    .line-text { display: table-cell; padding: 0 12px; white-space: pre; vertical-align: top; }

    /* Diff colours — industry standard */
    .line-text.removed { background: #ffebe9; }
    .line-text.added   { background: #e6ffec; }
    .line-text.empty   { background: var(--surface-in); }

    /* Active-change highlight */
    .diff-line.highlighted .line-num,
    .diff-line.highlighted .line-text { outline: 1px solid var(--amber); }
</style>
{% endblock %}

{% block content %}
<div class="compare-container">

    <!-- ── Toolbar ── -->
    <div class="compare-actions">
        <button class="btn btn-primary" onclick="runCompare()">Compare</button>
        <button class="btn btn-outline" onclick="resetCompare()">New Comparison</button>
        <span class="save-status" id="saveStatus"></span>

        <div class="nav-controls" id="diffNav" style="display:none">
            <span class="change-count" id="changeStat"></span>
            <button class="btn btn-outline btn-sm" onclick="navChange(-1)">↑ Prev</button>
            <button class="btn btn-outline btn-sm" onclick="navChange(1)">↓ Next</button>
        </div>
    </div>

    <!-- ── Input ── -->
    <div class="input-grid" id="inputArea">
        <div class="input-box">
            <label>Original</label>
            <textarea id="leftText"  class="compare-textarea" placeholder="Paste original code here…" oninput="scheduleSave()"></textarea>
        </div>
        <div class="input-box">
            <label>Modified</label>
            <textarea id="rightText" class="compare-textarea" placeholder="Paste modified code here…" oninput="scheduleSave()"></textarea>
        </div>
    </div>

    <!-- ── Diff panels ── -->
    <div class="diff-view" id="diffArea">
        <div class="diff-panel" id="leftPanel">
            <div class="diff-content" id="leftDiff"></div>
        </div>
        <div class="diff-panel" id="rightPanel">
            <div class="diff-content" id="rightDiff"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
<script>
    // ── Server-persisted content (Compare Data/content.json — see compare.py) ──
    const initialLeft  = {{ left | tojson }};
    const initialRight = {{ right | tojson }};

    // ── State ────────────────────────────────────────────────
    let changes      = [];   // [{leftRow, rightRow}]
    let activeChange = -1;

    // ── DOM refs ─────────────────────────────────────────────
    const leftPanel  = document.getElementById('leftPanel');
    const rightPanel = document.getElementById('rightPanel');
    const leftDiff   = document.getElementById('leftDiff');
    const rightDiff  = document.getElementById('rightDiff');
    const leftTextEl  = document.getElementById('leftText');
    const rightTextEl = document.getElementById('rightText');
    const saveStatusEl = document.getElementById('saveStatus');

    // Restore whatever was saved before the app was last closed.
    leftTextEl.value  = initialLeft;
    rightTextEl.value = initialRight;

    // ── Autosave (debounced, same shape as audio_notes.html) ───
    let saveTimer = null;
    function scheduleSave() {
        saveStatusEl.textContent = 'Saving\u2026';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveCompareData, 800);
    }
    function saveCompareData() {
        clearTimeout(saveTimer);
        fetch('/api/compare/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ left: leftTextEl.value, right: rightTextEl.value })
        }).then(function () {
            saveStatusEl.textContent = 'Saved';
            setTimeout(function () { saveStatusEl.textContent = ''; }, 1500);
        }).catch(function () {
            saveStatusEl.textContent = 'Save failed';
        });
    }

    // ── Scroll sync ──────────────────────────────────────────
    // Use a single flag to prevent infinite mutual triggering
    let scrollSource = null;

    leftPanel.addEventListener('scroll', () => {
        if (scrollSource === 'right') return;
        scrollSource = 'left';
        rightPanel.scrollTop  = leftPanel.scrollTop;
        rightPanel.scrollLeft = leftPanel.scrollLeft;
        requestAnimationFrame(() => scrollSource = null);
    });

    rightPanel.addEventListener('scroll', () => {
        if (scrollSource === 'left') return;
        scrollSource = 'right';
        leftPanel.scrollTop  = rightPanel.scrollTop;
        leftPanel.scrollLeft = rightPanel.scrollLeft;
        requestAnimationFrame(() => scrollSource = null);
    });

    // ── Helpers ──────────────────────────────────────────────
    function escape(str) {
        // Use DOM — never manual string replacement for HTML safety
        const t = document.createTextNode(str || ' ');
        const d = document.createElement('span');
        d.appendChild(t);
        return d.innerHTML;
    }

    function makeRow(lineNum, text, cssClass) {
        const row  = document.createElement('div');
        row.className = 'diff-line';
        // Line number cell
        const num  = document.createElement('div');
        num.className   = 'line-num';
        num.textContent = lineNum ?? ' ';
        // Text cell
        const cell = document.createElement('div');
        cell.className  = 'line-text' + (cssClass ? ' ' + cssClass : '');
        cell.innerHTML  = escape(text ?? ' ');   // safe: escape() uses DOM
        row.appendChild(num);
        row.appendChild(cell);
        return row;
    }

    // ── Core diff ────────────────────────────────────────────
    function runCompare() {
        const oldText = leftTextEl.value;
        const newText = rightTextEl.value;

        leftDiff.innerHTML  = '';
        rightDiff.innerHTML = '';
        changes      = [];
        activeChange = -1;

        const diff = Diff.diffLines(oldText, newText);
        let   lNum = 1, rNum = 1;

        diff.forEach(part => {
            const lines = part.value.split('\n');
            if (lines.at(-1) === '') lines.pop();

            lines.forEach(line => {
                if (part.added) {
                    const lRow = makeRow(null, null, 'empty');
                    const rRow = makeRow(rNum++, line, 'added');
                    leftDiff.appendChild(lRow);
                    rightDiff.appendChild(rRow);
                    changes.push({ lRow, rRow });
                } else if (part.removed) {
                    const lRow = makeRow(lNum++, line, 'removed');
                    const rRow = makeRow(null, null, 'empty');
                    leftDiff.appendChild(lRow);
                    rightDiff.appendChild(rRow);
                    changes.push({ lRow, rRow });
                } else {
                    leftDiff.appendChild(makeRow(lNum++, line, ''));
                    rightDiff.appendChild(makeRow(rNum++, line, ''));
                }
            });
        });

        // Show diff UI
        document.getElementById('inputArea').style.display = 'none';
        document.getElementById('diffArea').style.display  = 'grid';
        document.getElementById('diffNav').style.display   = 'flex';
        document.getElementById('changeStat').textContent  =
            `${changes.length} change${changes.length !== 1 ? 's' : ''}`;
    }

    // ── Navigation ───────────────────────────────────────────
    function navChange(dir) {
        if (!changes.length) return;

        // Remove previous highlight
        if (activeChange >= 0) {
            changes[activeChange].lRow.classList.remove('highlighted');
            changes[activeChange].rRow.classList.remove('highlighted');
        }

        activeChange = (activeChange + dir + changes.length) % changes.length;

        const { lRow, rRow } = changes[activeChange];
        lRow.classList.add('highlighted');
        rRow.classList.add('highlighted');
        rRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function resetCompare() {
        document.getElementById('inputArea').style.display = 'grid';
        document.getElementById('diffArea').style.display  = 'none';
        document.getElementById('diffNav').style.display   = 'none';
    }
</script>
{% endblock %}
