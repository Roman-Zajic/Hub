                Array.from(listEl.querySelectorAll('input[data-level]')).filter(function(c){ return c.dataset.year === cb.dataset.year; }).forEach(function(c){ if (c !== cb) c.checked = cb.checked; });
            } else if (cb.dataset.level === 'month'){
                Array.from(listEl.querySelectorAll('input[data-level="day"]')).filter(function(c){ return c.dataset.year === cb.dataset.year && c.dataset.month === cb.dataset.month; }).forEach(function(c){ c.checked = cb.checked; });
            }
            refreshTreeStates(pop);
            updateApplyState(pop, pseudoCol);
        });
    }

    pop.querySelector('[data-role="cancel"]').addEventListener('click', closePopover);
    pop.querySelector('[data-role="apply"]').addEventListener('click', function(){
        var selector = isDate ? 'input[data-level="day"]' : 'input[data-level="flat"]';
        var allValues = Array.from(pop.querySelectorAll(selector)).map(function(cb){ return cb.dataset.value; });
        var checkedValues = Array.from(pop.querySelectorAll(selector)).filter(function(cb){ return cb.checked; }).map(function(cb){ return cb.dataset.value; });
        onApply(checkedValues, allValues);
        closePopover();
    });

    setTimeout(function(){ document.addEventListener('mousedown', onDocMouseDownForPopover, true); }, 0);
}

function openDashboardFilterPopover(filterDef, anchorEl){
    var col = filterDef.col;
    var isDate = col.type === 'date';
    var listHtml = isDate
        ? renderDateTreeHtml(buildDashboardDateTree(col.key, col.key), vizDashboardFilters[col.key])
        : renderFlatListHtml(buildDashboardFlatUnique(col.key, col.key), vizDashboardFilters[col.key]);

    openFilterOnlyPopover(anchorEl, isDate, listHtml, function(checkedValues, allValues){
        if (checkedValues.length === allValues.length) delete vizDashboardFilters[col.key];
        else vizDashboardFilters[col.key] = new Set(checkedValues);
        renderVisualization();
    });
}

function openMatrixFilterPopover(placementIdx, dimIdx, visual, anchorEl){
    var dimCol = visual.dims[dimIdx];
    var ownFilters = vizMatrixFilters[placementIdx] || {};
    var baseForThis = computeRowsForVisual(vizLastBaseRows, vizLastPlaced, placementIdx);
    var passing = baseForThis.filter(function(row){ return rowPassesMatrixOwnFilters(row, visual, ownFilters, dimIdx); });

    var seen = {}; var values = [];
    passing.forEach(function(row){
        var val = getGroupValue(row, dimCol, visual.dimCalendars[dimIdx], visual.dimAggs[dimIdx]);
        if (!(val in seen)){ seen[val] = true; values.push(val); }
    });
    values.sort(function(a, b){ return a.localeCompare(b, undefined, {numeric: true}); });

    var listHtml = renderFlatListHtml(values, ownFilters[dimIdx]);

    openFilterOnlyPopover(anchorEl, false, listHtml, function(checkedValues, allValues){
        var filters = vizMatrixFilters[placementIdx] || {};
        if (checkedValues.length === allValues.length) delete filters[dimIdx];
        else filters[dimIdx] = new Set(checkedValues);
        vizMatrixFilters[placementIdx] = filters;
        renderVisualization();
    });
}

function renderVisualization(){
    var grid = vizGridTarget || document.getElementById('vizGrid');
    var errorsEl = document.getElementById('vizErrors');

    if (!columns.length){
        grid.innerHTML = '<div class="da-empty" style="grid-column:1/span 2;grid-row:1/span 2">Process some data in Input Data first.</div>';
        errorsEl.style.display = 'none';
        (vizFilterPanelTarget || document.getElementById('vizFilterPanel')).style.display = 'none';
        return;
    }

    var parsed = parseVizDefinition(document.getElementById('vizEditor').value);
    var packed = packVisuals(parsed.visuals);
    var allErrors = parsed.errors.concat(packed.overflowErrors);

    errorsEl.innerHTML = allErrors.map(function(e){ return '<div>'+escHtml(e)+'</div>'; }).join('');
    errorsEl.style.display = allErrors.length ? 'block' : 'none';

    vizFilterDefs = parsed.filterDefs;
    renderFilterPanel(vizFilterDefs);

    if (!packed.placed.length){
        grid.innerHTML = '<div class="da-empty" style="grid-column:1/span 2;grid-row:1/span 2">No visuals to show — switch to Edit and define at least one line.</div>';
        return;
    }

    // Dashboard filters (the panel above) sit under everything else — the
    // same base every visual's own cross-filtering further narrows.
    var baseRows = computeDisplayRows().filter(function(row){
        return Object.keys(vizDashboardFilters).every(function(k){
            var allowed = vizDashboardFilters[k];
            if (!allowed) return true;
            var cell = row[k];
            return cell && allowed.has(cell.d);
        });
    });
    vizLastBaseRows = baseRows;
    vizLastPlaced = packed.placed;

    grid.innerHTML = '';

    // Phase 1: build empty card shells and insert them, so column/bar/line
    // charts can measure REAL available space next (needed for the fixed
    // bar-size + scroll behavior — there's no such thing before layout).
    var pending = [];
    packed.placed.forEach(function(p, idx){
        var built = buildVisualCardShell(p.visual, p.row, p.col);
        grid.appendChild(built.card);
        pending.push({idx: idx, visual: p.visual, body: built.body});
    });

    // Phase 2: aggregate (respecting every OTHER visual's cross-filter
    // selection and matrix filters — see computeRowsForVisual — plus a
    // matrix's own filters restricting its own display) and draw.
    pending.forEach(function(item){
        var rowsForThis = computeRowsForVisual(baseRows, packed.placed, item.idx);
        if (item.visual.type === 'matrix'){
            var ownFilters = vizMatrixFilters[item.idx];
            if (ownFilters && Object.keys(ownFilters).length){
                rowsForThis = rowsForThis.filter(function(row){ return rowPassesMatrixOwnFilters(row, item.visual, ownFilters, null); });
            }
        }
        var groups = aggregateRows(rowsForThis, item.visual.dims, item.visual.dimAggs, item.visual.dimCalendars, item.visual.values);
        drawVisualBody(item.visual, item.body, groups, item.idx);
    });
}

// ── Edit / Preview toggle (same pattern as the Notes module) ────────
function setVizMode(mode){
    var wasPreview = vizMode === 'preview';
    vizMode = mode;
    var isPreview = mode === 'preview';
    if (isPreview && !wasPreview){ vizCrossFilters = {}; vizMatrixFilters = {}; vizDashboardFilters = {}; } // stale selections/filters don't carry across a definition change
    document.getElementById('vizEditorWrap').style.display = isPreview ? 'none' : 'flex';
    document.getElementById('vizPreviewWrap').style.display = isPreview ? 'flex' : 'none';
    document.getElementById('vizToolbar').style.display = isPreview ? 'none' : 'flex';
    document.getElementById('vizToggleModeBtn').textContent = isPreview ? 'Edit' : 'Preview';
    if (!isPreview) document.getElementById('vizErrors').style.display = 'none';
    if (isPreview) renderVisualization();
}
function toggleVizMode(){ setVizMode(vizMode === 'edit' ? 'preview' : 'edit'); }

// ── Full screen (same expand/close idea as the Timers widget) ───────
function openVizFullscreen(){
    document.getElementById('vizFullscreenOverlay').classList.add('open');

}

// ── Columns side panel (Edit mode only, lives inside vizEditorWrap) ──
// Lists every Clean Data column so field=/value= names can be clicked in
// instead of hand-typed — the whole point being to avoid typos against
// column names the person might not have all memorized/visible.
function renderColumnsPanel(){
    var list = document.getElementById('vizColumnsPanelList');
    var cols = visibleColumns();
    if (!cols.length){
        list.innerHTML = '<div class="filter-empty">Process some data in Input Data first.</div>';
        return;

    list.innerHTML = cols.map(function(c, i){
        return '<button type="button" class="viz-column-chip" data-idx="'+i+'" title="'+escAttr(c.label)+'">'+
            '<span class="viz-column-chip-name">'+escHtml(c.label)+'</span>'+

        btn.addEventListener('click', function(){ insertTextAtCursor(cols[i].label); });
    });
}

function insertTextAtCursor(text){
    var ta = document.getElementById('vizEditor');
    var start = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
    var end = ta.selectionEnd == null ? ta.value.length : ta.selectionEnd;
    var val = ta.value;
    ta.value = val.slice(0, start) + text + val.slice(end);
    var newPos = start + text.length;
    ta.focus();
    ta.selectionStart = ta.selectionEnd = newPos;
}

// ── Save / Load / Delete presets ─────────────────────────────────────
function loadVizPresetList(){
    return fetch('/api/data_analysis/visualizations').then(function(r){ return r.json(); }).then(function(map){
        vizPresets = map || {};
        var sel = document.getElementById('vizLoadSelect');
        var current = sel.value;
        sel.innerHTML = '<option value="">Load saved…</option>' + Object.keys(vizPresets).sort().map(function(n){
            return '<option value="'+escAttr(n)+'">'+escHtml(n)+'</option>';
        }).join('');
        if (current && vizPresets[current] !== undefined) sel.value = current;
    });
}

function onLoadVizChange(){
    var sel = document.getElementById('vizLoadSelect');
    var name = sel.value;
    if (!name){ currentVizName = null; return; }
    currentVizName = name;
    document.getElementById('vizEditor').value = vizPresets[name] || '';
    setVizMode('preview');
}

function saveVisualization(){
    var suggested = currentVizName || '';
    var name = prompt('Save visuals as:', suggested);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    fetch('/api/data_analysis/visualizations/save', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name: name, definition: document.getElementById('vizEditor').value})
    }).then(function(r){ return r.json(); }).then(function(d){
        if (d.status === 'error'){ alert(d.message || 'Could not save.'); return; }
        currentVizName = name;
        loadVizPresetList().then(function(){ document.getElementById('vizLoadSelect').value = name; });
    });
}

function deleteVisualization(){
    var sel = document.getElementById('vizLoadSelect');
    var name = sel.value;
    if (!name){ alert('Select a saved preset to delete first.'); return; }
    if (!confirm('Delete saved visuals "'+name+'"? This cannot be undone.')) return;
    fetch('/api/data_analysis/visualizations/delete', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name: name})
    }).then(function(){
        if (currentVizName === name){ currentVizName = null; document.getElementById('vizEditor').value = ''; }
        loadVizPresetList();
    });
}
