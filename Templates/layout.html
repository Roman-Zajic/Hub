<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>financial models</title>
    <style>
        /* ── Design Tokens ─────────────────────────────────── */
        :root {
            --font:          "Segoe UI", system-ui, -apple-system, sans-serif;
            --teal-900:      #005A5A;
            --teal-700:      #008282;
            --teal-400:      #50C1C1;
            --teal-100:      #95DFDB;
            --amber:         #E1A01E;
            --red:           #C41E3A;
            --ink:           #012D2C;
            --text:          #005A5A;
            --text-muted:    #008282;
            --surface-page:  #F0FAFA;
            --surface-card:  #FFFFFF;
            --surface-in:    #F0FAFA;
            --border:        #D0ECEB;
            --shadow:        0 1px 4px rgba(1,45,44,.10);
            --shadow-md:     0 4px 14px rgba(1,45,44,.12);
            --r:             10px;
            --nav-h:         52px;
            --sidebar-w:     220px;
        }

        /* ── Reset ─────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            font-size: 0.9375rem;
            color: var(--text);
            background: var(--surface-page);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Shell ─────────────────────────────────────────── */
        .navbar {
            height: var(--nav-h);
            background: var(--teal-900);
            display: flex;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
            z-index: 10;
        }
        .nav-brand-text,
        .nav-module-title { color: var(--teal-100); font-size: 0.9375rem; font-weight: 600; white-space: nowrap; }
        .nav-pipe { width: 1px; height: 18px; background: rgba(149,223,219,.30); margin: 0 14px; flex-shrink: 0; }

        .app-body { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface-card);
            border-right: 1px solid var(--border);
            padding: 12px 0;
            display: flex;
            flex-direction: column;
        }
        .nav-item {
            display: block;
            padding: 12px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            border-left: 6px solid transparent;
            transition: background 130ms, color 130ms;
        }
        .nav-item:hover  { background: var(--surface-in); color: var(--text); }
        .nav-item.active { background: var(--teal-100); color: var(--text); font-weight: 600; border-left-color: var(--teal-700); }

        .main-view   { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-area { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; }

        /* ── Shared Component Tokens ───────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font);
            font-size: 0.875rem;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            line-height: 1;
            transition: background 130ms, color 130ms, border-color 130ms;
            user-select: none;
        }
        .btn:active  { opacity: .85; }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn-primary { background: var(--teal-900); color: #fff; border-color: var(--teal-900); }
        .btn-primary:hover { background: var(--teal-700); border-color: var(--teal-700); }
        .btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
        .btn-outline:hover { border-color: var(--teal-700); color: var(--teal-700); }
        .btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
        .btn-danger:hover { background: #A01830; border-color: #A01830; }
        .btn-sm { font-size: 0.75rem; padding: 6px 14px; }
        .btn-lg { font-size: 1rem; padding: 12px 28px; }

        .input {
            font-family: var(--font);
            font-size: 0.875rem;
            color: var(--text);
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 9px 12px;
            outline: none;
            transition: border-color 130ms, box-shadow 130ms;
        }
        .input::placeholder { color: #7A9E9E; }
        .input:hover  { border-color: var(--teal-700); }
        .input:focus  { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(0,130,130,.15); }

        .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
        .section-label { font-size: 0.6875rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <!-- FIXED LOGO: Using Icon-Dark palette for visibility on Teal 900 -->
        <svg width="32" height="22" viewBox="0 0 60 42" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;flex-shrink:0">
            <rect x="0"  y="0"  width="17" height="12" rx="2.5" fill="#95DFDB"/>
            <rect x="21" y="0"  width="17" height="12" rx="2.5" fill="#50C1C1"/>
            <rect x="43" y="0"  width="17" height="12" rx="2.5" fill="#008282"/>
            <rect x="0"  y="15" width="17" height="12" rx="2.5" fill="#95DFDB"/>
            <rect x="21" y="15" width="17" height="12" rx="2.5" fill="#50C1C1"/>
            <rect x="43" y="15" width="17" height="12" rx="2.5" fill="#008282"/>
            <rect x="0"  y="30" width="17" height="12" rx="2.5" fill="#95DFDB"/>
            <rect x="21" y="30" width="17" height="12" rx="2.5" fill="#50C1C1"/>
            <rect x="43" y="30" width="17" height="12" rx="2.5" fill="#E1A01E"/>
        </svg>
        <div class="nav-pipe"></div>
        <span class="nav-brand-text">financial models</span>
        <div class="nav-pipe"></div>
        <div class="nav-module-title">{% block module_name %}{% endblock %}</div>
    </header>

    <div class="app-body">
        <aside class="sidebar">
            {% set path = request.path %}
            {% for m in nav_modules %}
            <a href="{{ m.path }}" class="nav-item {% if path == m.path or (path == '/' and loop.first) %}active{% endif %}">{{ m.label }}</a>
            {% endfor %}
        </aside>
        <main class="main-view">
            <div class="content-area">{% block content %}{% endblock %}</div>
        </main>
    </div>
</body>
</html>
