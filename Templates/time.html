{% extends 'layout.html' %}
{% block module_name %}Time Monitor{% endblock %}

{% block extra_css %}
<style>
    .time-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; height: 100%; min-height: 0; }
    .scroll-panel { overflow-y: auto; padding-right: 8px; }

    .card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; display: flex; flex-direction: column; min-height: 0; }
    .section-label { font-size: 0.7rem; font-weight: 800; color: var(--teal-700); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }

    /* Sticky Table Container */
    .table-container { flex: 1; overflow-y: auto; border: 1px solid var(--surface-page); border-radius: 6px; }
    .activity-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; table-layout: fixed; }

    /* The Fix for Sticky Headers */
    .activity-table thead th {
        position: sticky;
        top: 0;
        background: white;
        z-index: 10;
        box-shadow: inset 0 -2px 0 var(--surface-page);
        padding: 12px 8px;
        text-align: left;
        color: var(--teal-700);
    }

    .activity-table td { padding: 10px 8px; border-bottom: 1px solid var(--surface-page); vertical-align: middle; }

    .app-tag { font-weight: 700; color: var(--teal-400); font-size: 0.7rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title-text { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--teal-900); }

    .bar-row { margin-bottom: 15px; }
    .bar-info { display: flex; justify-content: space-between; font-size: 0.8125rem; margin-bottom: 5px; }
    .bar-outer { height: 8px; background: var(--surface-page); border-radius: 4px; overflow: hidden; }
    .bar-inner { height: 100%; background: var(--teal-700); transition: width 0.5s; }
    .bar-inner.project-bar { background: var(--amber); }

    .assign-select { padding: 4px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.75rem; width: 100%; cursor: pointer; }
    .assign-select:focus { border-color: var(--teal-700); outline: none; box-shadow: 0 0 0 2px var(--teal-100); }
</style>
{% endblock %}

{% block content %}
<div class="time-layout">
    <div class="scroll-panel">
        <div class="section-label">Active Windows (Today)</div>
        <div class="card" style="height: calc(100vh - 180px);">
            <div class="table-container">
                <table class="activity-table">
                    <thead>
                        <tr>
                            <th style="width: 50%;">App & Window Title</th>
                            <th style="width: 25%;">Duration</th>
                            <th style="width: 25%;">Project</th>
                        </tr>
                    </thead>
                    <tbody id="logTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="scroll-panel">
        <div class="section-label">Project Summary</div>
        <div class="card" id="projectBars"></div>

        <div class="section-label">Add Project</div>
        <div class="card">
            <div style="display:flex; gap:5px">
                <input type="text" id="newPId" style="width:60px; padding:8px; border:1px solid var(--border); border-radius:4px;" placeholder="ID">
                <input type="text" id="newPName" style="flex:1; padding:8px; border:1px solid var(--border); border-radius:4px;" placeholder="Name">
                <button class="btn btn-outline" onclick="addProject()">+</button>
            </div>
        </div>
    </div>
</div>

<script>
    let logs = {};
    let projects = [];
    let isUserInteracting = false;

    // Helper to format seconds like the original project
    function formatDuration(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        if (h > 0) return `${h}h ${m}m`;
        if (m > 0) return `${m}m ${s}s`;
        return `${s}s`;
    }

    async function loadData() {
        const res = await fetch('/api/time_data');
        const data = await res.json();
        logs = data.logs;
        projects = data.projects;

        // Anti-flicker: Only render if user isn't currently selecting something
        if (!isUserInteracting) {
            render();
        }
    }

    function render() {
        const total = Object.values(logs).reduce((a, b) => a + b, 0) || 1;
        const logTable = document.getElementById('logTable');
        const projectBars = document.getElementById('projectBars');

        let tableHtml = '';
        let projTimeMap = {};

        Object.entries(logs).sort((a,b) => b[1] - a[1]).forEach(([key, sec]) => {
            const [app, title] = key.split('|||');
            const pct = ((sec/total)*100).toFixed(1);

            let assignedPId = "";
            projects.forEach(p => { if(p.titles && p.titles.includes(title)) assignedPId = p.id; });
            if(assignedPId) projTimeMap[assignedPId] = (projTimeMap[assignedPId] || 0) + sec;

            tableHtml += `
                <tr>
                    <td>
                        <span class="app-tag">${app}</span>
                        <span class="title-text" title="${title}">${title}</span>
                    </td>
                    <td>
                        <div style="font-weight:600">${formatDuration(sec)}</div>
                        <div style="font-size:0.7rem; color:var(--teal-400)">${pct}%</div>
                    </td>
                    <td>
                        <select class="assign-select"
                                onfocus="isUserInteracting=true"
                                onblur="isUserInteracting=false"
                                onchange="assignTitle('${title}', this.value)">
                            <option value="">Unassigned</option>
                            ${projects.map(p => `<option value="${p.id}" ${assignedPId==p.id?'selected':''}>${p.name}</option>`).join('')}
                        </select>
                    </td>
                </tr>`;
        });
        logTable.innerHTML = tableHtml;

        // Render Summary Bars
        projectBars.innerHTML = projects.map(p => {
            const pSec = projTimeMap[p.id] || 0;
            const pPct = ((pSec/total)*100).toFixed(1);
            return `
                <div class="bar-row">
                    <div class="bar-info">
                        <span><strong>${p.id}</strong> ${p.name}</span>
                        <span>${formatDuration(pSec)} (${pPct}%)</span>
                    </div>
                    <div class="bar-outer"><div class="bar-inner project-bar" style="width: ${pPct}%"></div></div>
                </div>`;
        }).join('') || '<div style="color:var(--teal-400); font-size:0.8rem;">No projects defined.</div>';
    }

    async function assignTitle(title, pId) {
        isUserInteracting = false; // Release lock on change
        projects.forEach(p => { p.titles = (p.titles || []).filter(t => t !== title); });
        if(pId) {
            const proj = projects.find(p => p.id === pId);
            if(proj) {
                if(!proj.titles) proj.titles = [];
                proj.titles.push(title);
            }
        }
        await fetch('/api/projects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(projects)
        });
        loadData();
    }

    async function addProject() {
        const id = document.getElementById('newPId').value;
        const name = document.getElementById('newPName').value;
        if(!id || !name) return;
        projects.push({id, name, titles: []});
        await fetch('/api/projects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(projects)
        });
        document.getElementById('newPId').value = '';
        document.getElementById('newPName').value = '';
        loadData();
    }

    setInterval(loadData, 3000);
    loadData();
</script>
{% endblock %}
