<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Zajic</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- SETTINGS MODAL POPUP -->
    <div class="modal-overlay" id="settings-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>App Settings</span>
                <button class="modal-close" id="settings-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="field">
                    <label class="field-label">GitHub Repository</label>
                    <input type="text" id="set-gh-repo" class="input" placeholder="username/repo">
                </div>
                <div class="field">
                    <label class="field-label">GitHub PAT</label>
                    <input type="password" id="set-gh-token" class="input" placeholder="ghp_...">
                </div>
                <div class="field">
                    <label class="field-label">Notes Folder in Repo (optional)</label>
                    <input type="text" id="set-gh-folder" class="input" placeholder="e.g. notes (leave empty for repo root)">
                </div>
                <div class="field">
                    <label class="field-label">Local Work Folder (Desktop)</label>
                    <button id="set-local-folder" class="btn btn-outline">Select Folder</button>
                    <div id="set-local-status" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">No folder selected</div>
                </div>
                <div class="field">
                    <label class="field-label">Modules on this device</label>
                    <div class="multi-select" id="set-modules">
                        <button type="button" class="input multi-select-btn" id="set-modules-btn">
                            <span id="set-modules-label">All modules</span>
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 8 11 13 6"/></svg>
                        </button>
                        <div class="multi-select-menu" id="set-modules-menu"></div>
                    </div>
                    <div class="field-hint">Saved on this device only.</div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="settings-save" class="btn btn-primary">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- NAVBAR -->
    <header class="navbar">
        <button id="mobile-menu-btn" class="mobile-only">☰</button>
        
        <!-- SVG Logo -->
        <a class="brand-icon" href="#" style="margin-right: 12px; display: flex; align-items: center;">
            <svg width="24" height="17" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="0"  y="0"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
                <rect x="11" y="0"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
                <rect x="22" y="0"  width="9" height="6" rx="1.5" fill="#008282"/>
                <rect x="0"  y="8"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
                <rect x="11" y="8"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
                <rect x="22" y="8"  width="9" height="6" rx="1.5" fill="#008282"/>
                <rect x="0"  y="16" width="9" height="6" rx="1.5" fill="#95DFDB"/>
                <rect x="11" y="16" width="9" height="6" rx="1.5" fill="#50C1C1"/>
                <rect x="22" y="16" width="9" height="6" rx="1.5" fill="#E1A01E"/>
            </svg>
        </a>

        <span class="nav-brand-text">
            <span id="brand-name-desktop" class="brand-desktop"></span>
            <span class="brand-mobile">RZ</span>
        </span>
        <div class="nav-pipe"></div>
        <div class="nav-module-title" id="active-module-title"></div>
        
        <div class="nav-links-right">
            <button id="settings-btn" class="icon-btn" title="Settings">
                <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
            </button>
        </div>
    </header>

    <div class="app-body">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-view">
            <div class="content-area" id="app-root"></div>
        </main>
    </div>

    <!-- PERSISTENT FOOTER -->
    <footer class="footer">
        <span><strong>Roman Zajic</strong></span>
        <span class="footer-dot">·</span>
        <span id="footer-module-name">Loading...</span>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
