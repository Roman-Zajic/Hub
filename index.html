<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Zajic</title>
    <meta name="theme-color" content="#005A5A">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 31 22'%3E%3Crect width='9' height='6' rx='1.5' fill='%2395DFDB'/%3E%3Crect x='11' width='9' height='6' rx='1.5' fill='%2350C1C1'/%3E%3Crect x='22' width='9' height='6' rx='1.5' fill='%23008282'/%3E%3Crect y='8' width='9' height='6' rx='1.5' fill='%2395DFDB'/%3E%3Crect x='11' y='8' width='9' height='6' rx='1.5' fill='%2350C1C1'/%3E%3Crect x='22' y='8' width='9' height='6' rx='1.5' fill='%23008282'/%3E%3Crect y='16' width='9' height='6' rx='1.5' fill='%2395DFDB'/%3E%3Crect x='11' y='16' width='9' height='6' rx='1.5' fill='%2350C1C1'/%3E%3Crect x='22' y='16' width='9' height='6' rx='1.5' fill='%23E1A01E'/%3E%3C/svg%3E">
    <!-- After a deploy bump v= here (GitHub Pages caches files for ~10 min): styles.css and app.js; everything else follows app.js -->
    <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
    <!-- SETTINGS MODAL POPUP -->
    <div class="modal-overlay" id="settings-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>App Settings</span>
                <button class="modal-close" id="settings-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="field field-inline">
                    <label class="field-label" for="set-gh-repo">GitHub repo</label>
                    <div class="field-control"><input type="text" id="set-gh-repo" class="input" placeholder="username/repo/folder" autocomplete="off" spellcheck="false"></div>
                </div>
                <div class="field field-inline">
                    <label class="field-label" for="set-gh-token">GitHub token</label>
                    <div class="field-control"><input type="password" id="set-gh-token" class="input" placeholder="ghp_..." autocomplete="new-password" spellcheck="false"></div>
                </div>
                <div class="field field-inline">
                    <label class="field-label" for="set-local-path">Working directory</label>
                    <div class="field-control">
                        <input type="text" id="set-local-path" class="input" placeholder="None selected" autocomplete="off" spellcheck="false" title="The browser only tells the app the folder name. You can type the full path here as a reminder.">
                        <button type="button" id="set-local-folder" class="btn btn-outline btn-sm">Select</button>
                    </div>
                </div>
                <div class="field field-inline">
                    <label class="field-label">Modules</label>
                    <div class="field-control">
                        <div class="multi-select" id="set-modules">
                            <button type="button" class="input multi-select-btn" id="set-modules-btn">
                                <span id="set-modules-label">All modules</span>
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 8 11 13 6"/></svg>
                            </button>
                            <div class="multi-select-menu" id="set-modules-menu"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="settings-save" class="btn btn-primary">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- NAVBAR -->
    <header class="navbar">
        <button id="mobile-menu-btn" class="mobile-only">☰</button>
        
        <!-- SVG Logo -->
        <a class="brand-icon" href="#" style="margin-right: 12px; display: flex; align-items: center;">
            <svg width="24" height="17" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="0"  y="0"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
                <rect x="11" y="0"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
                <rect x="22" y="0"  width="9" height="6" rx="1.5" fill="#008282"/>
                <rect x="0"  y="8"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
                <rect x="11" y="8"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
                <rect x="22" y="8"  width="9" height="6" rx="1.5" fill="#008282"/>
                <rect x="0"  y="16" width="9" height="6" rx="1.5" fill="#95DFDB"/>
                <rect x="11" y="16" width="9" height="6" rx="1.5" fill="#50C1C1"/>
                <rect x="22" y="16" width="9" height="6" rx="1.5" fill="#E1A01E"/>
            </svg>
        </a>

        <span class="nav-brand-text">
            <span id="brand-name-desktop" class="brand-desktop"></span>
            <span class="brand-mobile">RZ</span>
        </span>
        <div class="nav-pipe"></div>
        <div class="nav-module-title" id="active-module-title"></div>
        
        <div class="nav-links-right">
            <button id="settings-btn" class="icon-btn" title="Settings">
                <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
            </button>
        </div>
    </header>

    <div class="app-body">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-view">
            <div class="content-area" id="app-root"></div>
        </main>
    </div>

    <!-- PERSISTENT FOOTER -->
    <footer class="footer">
        <span><strong>Roman Zajic</strong></span>
        <span class="footer-dot">·</span>
        <span id="footer-module-name">Loading...</span>
    </footer>

    <div class="toast" id="app-toast"></div>

    <script type="module" src="app.js?v=1"></script>
</body>
</html>
